<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Massive Darkness — Heroes Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --bg2: #111118;
    --card: #16161f;
    --card2: #1e1e2a;
    --border: #2a2a3a;
    --gold: #c9a84c;
    --gold-light: #e8c87a;
    --gold-dark: #8a6f2e;
    --red: #cc3333;
    --red-light: #ee5555;
    --blue: #3366cc;
    --blue-light: #5588ee;
    --purple: #8844cc;
    --purple-light: #aa66ee;
    --green: #2a8844;
    --green-light: #44aa66;
    --text: #e8e0d0;
    --text-muted: #888899;
    --xp-color: #44aaff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Lato', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ===== SCREEN SYSTEM ===== */
  .screen { display: none; min-height: 100vh; }
  .screen.active { display: flex; flex-direction: column; }

  /* ===== PARTICLES ===== */
  #particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .particle {
    position: absolute; border-radius: 50%;
    background: radial-gradient(circle, var(--gold) 0%, transparent 70%);
    animation: float linear infinite;
    opacity: 0;
  }
  @keyframes float {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 0.4; }
    90% { opacity: 0.2; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  /* ===== INTRO ===== */
  #screen-intro {
    align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 30%, #1a1020 0%, #0a0a0f 70%);
    padding: 24px;
    position: relative; z-index: 1;
  }
  .intro-logo {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(22px, 5vw, 42px);
    color: var(--gold);
    text-align: center;
    text-shadow: 0 0 40px rgba(201,168,76,0.5);
    letter-spacing: 3px;
    margin-bottom: 6px;
    animation: glow 3s ease-in-out infinite alternate;
  }
  .intro-sub {
    font-family: 'Cinzel', serif;
    font-size: clamp(10px, 2vw, 14px);
    color: var(--gold-dark);
    text-align: center;
    letter-spacing: 6px;
    text-transform: uppercase;
    margin-bottom: 48px;
  }
  @keyframes glow {
    from { text-shadow: 0 0 20px rgba(201,168,76,0.3); }
    to   { text-shadow: 0 0 60px rgba(201,168,76,0.8); }
  }

  /* ===== PLAYER COUNT ===== */
  .player-count-grid {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px;
    margin-bottom: 40px; max-width: 480px; width: 100%;
  }
  .pcount-btn {
    aspect-ratio: 1; border-radius: 14px;
    border: 2px solid var(--border);
    background: var(--card);
    color: var(--text-muted);
    font-family: 'Cinzel Decorative', serif;
    font-size: 22px; cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .pcount-btn:hover, .pcount-btn.selected {
    border-color: var(--gold); color: var(--gold);
    background: var(--card2);
    box-shadow: 0 0 20px rgba(201,168,76,0.3);
    transform: scale(1.08);
  }

  /* ===== NAME INPUTS ===== */
  .name-inputs { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 400px; margin-bottom: 32px; }
  .name-input {
    background: var(--card2); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 16px;
    color: var(--text); font-family: 'Lato', sans-serif; font-size: 14px;
    outline: none; transition: border-color 0.2s;
    width: 100%;
  }
  .name-input:focus { border-color: var(--gold); }
  .name-input::placeholder { color: var(--text-muted); }

  /* ===== CLASSES SCREEN ===== */
  #screen-classes {
    align-items: center; justify-content: flex-start; padding: 24px;
    background: radial-gradient(ellipse at 50% 0%, #12101a 0%, #0a0a0f 60%);
    position: relative; z-index: 1;
  }
  .phase-title {
    font-family: 'Cinzel', serif;
    font-size: clamp(11px, 2vw, 13px);
    letter-spacing: 4px; text-transform: uppercase;
    color: var(--gold-dark); margin-bottom: 4px;
  }
  .phase-name {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(16px, 3vw, 24px);
    color: var(--gold); margin-bottom: 6px;
    text-align: center;
  }
  .classes-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 10px; width: 100%; max-width: 900px; margin-top: 24px;
  }
  .class-btn {
    padding: 16px 10px; border-radius: 14px;
    border: 1.5px solid var(--border); background: var(--card);
    cursor: pointer; transition: all 0.25s;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    color: var(--text);
    animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .class-btn:hover {
    border-color: var(--gold); background: var(--card2);
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(201,168,76,0.2);
  }
  .class-icon { font-size: 28px; }
  .class-name {
    font-family: 'Cinzel', serif; font-size: 11px;
    letter-spacing: 1px; text-align: center; color: var(--gold);
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.6) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* ===== HEROES SCREEN ===== */
  #screen-heroes {
    align-items: center; padding: 24px;
    background: radial-gradient(ellipse at 50% 0%, #120a1a 0%, #0a0a0f 60%);
    position: relative; z-index: 1;
  }
  .heroes-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px; width: 100%; max-width: 900px; margin-top: 24px;
  }
  .hero-card-pick {
    border-radius: 16px; border: 2px solid var(--border);
    background: var(--card); cursor: pointer;
    transition: all 0.25s; overflow: hidden;
    display: flex; flex-direction: column;
    animation: popIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .hero-card-pick:hover {
    border-color: var(--purple-light);
    transform: translateY(-4px);
    box-shadow: 0 8px 28px rgba(136,68,204,0.3);
  }
  .hero-img {
    width: 100%; aspect-ratio: 3/4; object-fit: cover; object-position: top;
    background: var(--card2);
  }
  .hero-img-placeholder {
    width: 100%; aspect-ratio: 3/4;
    background: linear-gradient(135deg, var(--card2), var(--card));
    display: flex; align-items: center; justify-content: center;
    font-size: 48px;
  }
  .hero-pick-name {
    font-family: 'Cinzel', serif; font-size: 11px;
    color: var(--gold); text-align: center;
    padding: 10px 8px; letter-spacing: 1px;
  }

  /* ===== STATS CONFIRM ===== */
  #screen-stats {
    align-items: center; justify-content: center; padding: 24px;
    background: radial-gradient(ellipse at 50% 30%, #0e0a18 0%, #0a0a0f 70%);
    position: relative; z-index: 1;
  }
  .stat-confirm-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 20px; padding: 32px; max-width: 640px; width: 100%;
    box-shadow: 0 0 60px rgba(136,68,204,0.15);
  }
  .hero-preview {
    width: auto; height: auto; max-width: 100%; max-height: 62vh;
    border-radius: 12px;
    object-fit: contain;
    margin: 0 auto 16px; display: block;
    border: 2px solid var(--purple);
    box-shadow: 0 0 30px rgba(136,68,204,0.45);
  }
  .stat-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--card2); border-radius: 10px; padding: 10px 14px;
    margin-bottom: 10px;
  }
  .stat-label { font-family: 'Cinzel', serif; font-size: 11px; color: var(--text-muted); flex: 1; letter-spacing: 1px; }
  .stat-stepper { display: flex; align-items: center; gap: 8px; }
  .step-btn {
    width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--bg);
    color: var(--text); font-size: 16px; cursor: pointer;
    transition: all 0.15s; display: flex; align-items: center; justify-content: center;
  }
  .step-btn:hover { border-color: var(--gold); color: var(--gold); }
  .stat-val {
    font-family: 'Cinzel Decorative', serif; font-size: 20px;
    color: var(--gold); min-width: 32px; text-align: center;
  }

  /* ===== DASHBOARD ===== */
  #screen-dashboard {
    padding: 16px; align-items: flex-start;
    background: var(--bg);
    position: relative; z-index: 1;
  }
  .dashboard-header {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px; padding: 14px 22px;
    background: var(--card); border-radius: 12px;
    border: 1px solid var(--border);
  }
  .dash-title {
    font-family: 'Cinzel Decorative', serif; font-size: 17px; color: var(--gold);
    letter-spacing: 2px;
  }
  .dash-controls { display: flex; gap: 8px; }
  .btn-sm {
    padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card2); color: var(--text-muted);
    font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 1px;
    cursor: pointer; transition: all 0.15s;
  }
  .btn-sm:hover { border-color: var(--gold); color: var(--gold); }

  /* Kill event buttons */
  .kill-panel {
    width: 100%; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 20px; margin-bottom: 20px;
    display: flex; align-items: center; flex-wrap: wrap; gap: 12px;
  }
  .kill-label { font-family: 'Cinzel', serif; font-size: 12px; color: var(--gold-dark); letter-spacing: 1px; flex: 0 0 auto; }
  .kill-btn {
    padding: 10px 20px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card2); color: var(--text);
    font-family: 'Cinzel', serif; font-size: 12px; cursor: pointer;
    transition: all 0.15s; letter-spacing: 1px;
  }
  .kill-btn.horde { border-color: #cc5533; color: #ee7755; }
  .kill-btn.horde:hover { background: rgba(204,85,51,0.15); }
  .kill-btn.roaming { border-color: var(--purple); color: var(--purple-light); }
  .kill-btn.roaming:hover { background: rgba(136,68,204,0.15); }
  .kill-btn.objetivo { border-color: var(--xp-color); color: var(--xp-color); }
  .kill-btn.objetivo:hover { background: rgba(68,170,255,0.12); }

  /* Player hero cards */
  .heroes-dashboard {
    width: 100%; display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 22px;
  }
  .hero-dash-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 20px; overflow: hidden;
    transition: border-color 0.2s;
    position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  .hero-dash-card.dead { opacity: 0.5; filter: grayscale(0.7); }

  /* XP + Level bar at top */
  .hero-level-bar {
    background: linear-gradient(135deg, #0a0818, #12101e);
    padding: 12px 16px 10px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }
  .level-badge {
    font-family: 'Cinzel Decorative', serif;
    font-size: 12px; color: var(--bg);
    background: var(--gold);
    padding: 4px 12px; border-radius: 20px;
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .xp-info {
    display: flex; flex-direction: column; align-items: center; flex: 1; margin: 0 12px;
  }
  .xp-val {
    font-family: 'Cinzel Decorative', serif; font-size: 20px;
    color: var(--xp-color);
    line-height: 1;
  }
  .xp-label { font-size: 9px; color: var(--text-muted); letter-spacing: 1px; font-family: 'Cinzel', serif; }
  .xp-needed { font-size: 10px; color: var(--text-muted); }
  .xp-bar-wrap {
    height: 5px; background: var(--border); border-radius: 2px; margin-top: 5px;
    width: 100%; max-width: 140px;
  }
  .xp-bar { height: 100%; border-radius: 2px; background: var(--xp-color); transition: width 0.4s; }

  /* Full hero card portrait — carta completa, sem corte */
  .hero-portrait-wrap-full {
    position: relative; width: 100%;
    background: linear-gradient(160deg, #0e0c18, #050508);
    display: flex; align-items: center; justify-content: center;
  }
  .hero-portrait-full {
    width: 100%; height: auto; max-height: 520px; object-fit: contain;
    display: block;
  }
  .hero-portrait-placeholder-full {
    width: 100%; aspect-ratio: 3/4;
    background: linear-gradient(135deg, var(--card2), var(--card));
    display: flex; align-items: center; justify-content: center;
  }
  .player-name-tag-full {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.9));
    font-family: 'Cinzel', serif; font-size: 12px;
    color: var(--gold); text-align: center; padding: 26px 8px 8px;
    letter-spacing: 2px; text-transform: uppercase;
  }

  .hero-stats-full { padding: 14px 18px; display: flex; flex-direction: column; gap: 12px; }
  .hero-name-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

  .hero-name {
    font-family: 'Cinzel', serif; font-size: 15px; color: var(--text);
    letter-spacing: 1px; line-height: 1.3;
  }
  .hero-class { font-size: 11px; color: var(--purple-light); font-family: 'Cinzel', serif; letter-spacing: 1px; }

  /* Stat bars */
  .stat-bar-row { display: flex; flex-direction: column; gap: 3px; }
  .stat-bar-header { display: flex; justify-content: space-between; align-items: center; }
  .stat-bar-label { font-size: 10px; color: var(--text-muted); font-family: 'Cinzel', serif; letter-spacing: 1px; }
  .stat-bar-val { font-family: 'Cinzel Decorative', serif; font-size: 16px; }
  .stat-bar-val.hp { color: var(--red-light); }
  .stat-bar-val.mp { color: var(--blue-light); }
  .stat-bar-track { height: 7px; background: var(--border); border-radius: 3px; }
  .stat-bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
  .stat-bar-fill.hp { background: linear-gradient(90deg, #aa2222, #ee5555); }
  .stat-bar-fill.mp { background: linear-gradient(90deg, #2244aa, #4488ee); }

  /* Action buttons */
  .hero-actions { padding: 10px 14px; border-top: 1px solid var(--border); display: flex; gap: 8px; flex-wrap: wrap; }
  .act-btn {
    flex: 1; min-width: 70px; padding: 9px 4px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--card2);
    font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 1px;
    cursor: pointer; transition: all 0.15s; color: var(--text-muted);
    text-align: center;
  }
  .act-btn.dmg { border-color: #7a2a2a; color: var(--red-light); }
  .act-btn.dmg:hover { background: rgba(204,51,51,0.15); border-color: var(--red); }
  .act-btn.heal { border-color: #2a6a2a; color: var(--green-light); }
  .act-btn.heal:hover { background: rgba(42,136,68,0.15); border-color: var(--green); }
  .act-btn.mana { border-color: #2a3a7a; color: var(--blue-light); }
  .act-btn.mana:hover { background: rgba(51,102,204,0.15); border-color: var(--blue); }
  .act-btn.xpbtn { border-color: rgba(68,170,255,0.4); color: var(--xp-color); }
  .act-btn.xpbtn:hover { background: rgba(68,170,255,0.1); }

  /* ===== MODAL ===== */
  .modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.75); align-items: center; justify-content: center;
    padding: 24px;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 20px; padding: 28px; max-width: 340px; width: 100%;
    box-shadow: 0 0 60px rgba(0,0,0,0.8);
    animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  .modal-title {
    font-family: 'Cinzel', serif; font-size: 14px; color: var(--gold);
    letter-spacing: 2px; text-align: center; margin-bottom: 16px;
    text-transform: uppercase;
  }
  .modal-input {
    width: 100%; background: var(--card2); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 16px;
    color: var(--text); font-family: 'Cinzel Decorative', serif; font-size: 22px;
    text-align: center; outline: none; transition: border-color 0.2s;
    margin-bottom: 16px;
  }
  .modal-input:focus { border-color: var(--gold); }
  .modal-btns { display: flex; gap: 10px; }
  .modal-confirm {
    flex: 1; padding: 12px; border-radius: 10px;
    border: 1px solid var(--gold); background: rgba(201,168,76,0.1);
    color: var(--gold); font-family: 'Cinzel', serif; font-size: 12px;
    letter-spacing: 2px; cursor: pointer; transition: all 0.15s;
  }
  .modal-confirm:hover { background: rgba(201,168,76,0.2); }
  .modal-cancel {
    flex: 1; padding: 12px; border-radius: 10px;
    border: 1px solid var(--border); background: transparent;
    color: var(--text-muted); font-family: 'Cinzel', serif; font-size: 12px;
    letter-spacing: 1px; cursor: pointer;
  }

  /* ===== EVENT TOAST (kills / objetivo) ===== */
  #levelup-toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: linear-gradient(135deg, #1a1208, #2a2010);
    border: 2px solid var(--gold); border-radius: 16px;
    padding: 16px 28px; z-index: 200;
    font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: 1px; color: var(--gold);
    box-shadow: 0 0 40px rgba(201,168,76,0.5);
    text-align: center;
    display: none;
    animation: none;
    max-width: 90vw;
  }
  #levelup-toast.show {
    display: block;
    animation: toastIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(-50%) translateY(20px) scale(0.8); }
    to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  }

  /* ===== LEVEL UP MODAL (popup grande) ===== */
  .levelup-overlay {
    display: none; position: fixed; inset: 0; z-index: 300;
    background: rgba(0,0,0,0.82); align-items: center; justify-content: center;
    padding: 24px; backdrop-filter: blur(6px);
  }
  .levelup-overlay.open { display: flex; }
  .levelup-box {
    background: linear-gradient(160deg, #17131f, #0c0a12);
    border: 2px solid var(--gold);
    border-radius: 24px; padding: 36px 32px 28px;
    max-width: 420px; width: 100%;
    text-align: center;
    box-shadow: 0 0 80px rgba(201,168,76,0.35), 0 20px 60px rgba(0,0,0,0.7);
    animation: levelupIn 0.45s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes levelupIn {
    from { opacity: 0; transform: scale(0.75) translateY(30px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .levelup-logo { margin: 0 auto 14px; }
  .levelup-heading {
    font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: 5px;
    color: var(--gold-dark); text-transform: uppercase; margin-bottom: 18px;
  }
  .levelup-portrait-wrap { margin: 0 auto 18px; display: flex; justify-content: center; }
  .levelup-portrait {
    width: 170px; height: auto; max-height: 260px; object-fit: contain;
    border: 2px solid var(--gold); border-radius: 14px;
    box-shadow: 0 0 30px rgba(201,168,76,0.4);
  }
  .levelup-portrait-placeholder { display: flex; align-items: center; justify-content: center; }
  .levelup-name {
    font-family: 'Cinzel Decorative', serif; font-size: 24px; color: var(--gold);
    letter-spacing: 1px; margin-bottom: 4px;
  }
  .levelup-hero-name {
    font-family: 'Cinzel', serif; font-size: 12px; color: var(--purple-light);
    letter-spacing: 2px; text-transform: uppercase; margin-bottom: 18px;
  }
  .levelup-level {
    display: flex; align-items: baseline; justify-content: center; gap: 10px;
    margin-bottom: 14px;
  }
  .levelup-level span:first-child {
    font-family: 'Cinzel', serif; font-size: 13px; color: var(--text-muted); letter-spacing: 3px;
  }
  .levelup-level-num {
    font-family: 'Cinzel Decorative', serif; font-size: 42px; color: var(--gold);
    text-shadow: 0 0 30px rgba(201,168,76,0.6);
  }
  .levelup-bonus {
    font-family: 'Cinzel', serif; font-size: 12px; color: var(--green-light);
    letter-spacing: 1px; margin-bottom: 24px;
  }
  .levelup-continue { width: 100%; }

  /* ===== BUTTONS ===== */
  .btn-primary {
    padding: 14px 36px; border-radius: 12px;
    border: 1px solid var(--gold); background: rgba(201,168,76,0.1);
    color: var(--gold); font-family: 'Cinzel', serif; font-size: 12px;
    letter-spacing: 3px; text-transform: uppercase; cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary:hover { background: rgba(201,168,76,0.2); box-shadow: 0 0 20px rgba(201,168,76,0.3); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

  .step-label { font-family: 'Cinzel', serif; font-size: 13px; color: var(--gold-dark); letter-spacing: 2px; text-align: center; margin-bottom: 16px; }

  /* ===== LOADING ===== */
  .loading-dots { display: flex; gap: 6px; }
  .loading-dots span {
    width: 8px; height: 8px; border-radius: 50%; background: var(--gold);
    animation: bounce 1.2s ease-in-out infinite;
  }
  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,80%,100%{transform:scale(0);opacity:0.3} 40%{transform:scale(1);opacity:1} }

  .section-divider { width: 100%; max-width: 900px; border: none; border-top: 1px solid var(--border); margin: 16px 0; }

  /* ===== LETTER MARKS (substitui ícones/emoji por tipografia) ===== */
  .letter-mark {
    font-family: 'Cinzel Decorative', serif;
    color: var(--gold);
    letter-spacing: 0.5px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1.5px solid var(--gold-dark);
    border-radius: 50%;
    background: var(--card2);
    flex-shrink: 0;
    line-height: 1;
  }
  .letter-mark-sm { width: 34px; height: 34px; font-size: 12px; }
  .letter-mark-md { width: 46px; height: 46px; font-size: 15px; }
  .letter-mark-lg { width: 72px; height: 72px; font-size: 22px; border-width: 2px; }
  .letter-mark-xl { width: 110px; height: 110px; font-size: 30px; border-width: 2px; }

  /* ===== LOGO ===== */
  .site-logo-img {
    display: block; margin: 0 auto 18px; width: min(360px, 80vw); height: auto;
    filter: drop-shadow(0 0 30px rgba(201,168,76,0.35));
  }
  .site-logo-img-sm { display: block; height: 34px; width: auto; }
  .dash-title-wrap { display: flex; align-items: center; gap: 12px; }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 500px) {
    .heroes-dashboard { grid-template-columns: 1fr; }
    .classes-grid { grid-template-columns: repeat(3, 1fr); }
    .heroes-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div id="particles"></div>

<!-- LEVEL UP TOAST -->
<div id="levelup-toast"></div>

<!-- MODAL -->
<div id="modal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-title" id="modal-title">Inserir Valor</div>
    <input id="modal-input" class="modal-input" type="number" min="0" value="0">
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">Cancelar</button>
      <button class="modal-confirm" onclick="confirmModal()">Confirmar</button>
    </div>
  </div>
</div>

<!-- LEVEL UP MODAL (popup grande) -->
<div id="levelup-overlay" class="levelup-overlay">
  <div class="levelup-box">
    <img class="site-logo-img-sm levelup-logo" id="logo-levelup" alt="Massive Darkness 2">
    <div class="levelup-heading">Subiu de Nível</div>
    <div id="levelup-portrait-wrap" class="levelup-portrait-wrap"></div>
    <div class="levelup-name" id="levelup-name"></div>
    <div class="levelup-hero-name" id="levelup-hero-name"></div>
    <div class="levelup-level"><span>NÍVEL</span><span class="levelup-level-num" id="levelup-level-num"></span></div>
    <div class="levelup-bonus" id="levelup-bonus"></div>
    <button class="btn-primary levelup-continue" onclick="closeLevelUpModal()">Continuar</button>
  </div>
</div>

<!-- ======================== SCREEN: INTRO ======================== -->
<div id="screen-intro" class="screen active">
  <img class="site-logo-img" id="logo-intro" alt="Massive Darkness 2">
  <div class="intro-sub">Heroes Dashboard</div>

  <div class="step-label" id="intro-step-label">Quantos heróis jogarão esta partida?</div>

  <div class="player-count-grid" id="count-grid"></div>

  <div id="name-section" style="display:none; flex-direction:column; align-items:center; width:100%; max-width:400px;">
    <div class="step-label">Nome dos jogadores</div>
    <div class="name-inputs" id="name-inputs"></div>
    <button class="btn-primary" id="btn-next-names" onclick="goToClasses()">Continuar →</button>
  </div>
</div>

<!-- ======================== SCREEN: CLASSES ======================== -->
<div id="screen-classes" class="screen">
  <div style="text-align:center; width:100%; max-width:900px;">
    <div class="phase-title">Escolha da Classe</div>
    <div class="phase-name" id="classes-player-label"></div>
    <div style="font-size:11px; color:var(--text-muted); font-family:'Cinzel',serif; letter-spacing:1px;">Escolha a classe do seu personagem</div>
  </div>
  <div class="classes-grid" id="classes-grid"></div>
</div>

<!-- ======================== SCREEN: HEROES ======================== -->
<div id="screen-heroes" class="screen">
  <div style="text-align:center; width:100%; max-width:900px;">
    <div class="phase-title">Escolha do Herói</div>
    <div class="phase-name" id="heroes-player-label"></div>
    <div style="font-size:11px; color:var(--text-muted); font-family:'Cinzel',serif; letter-spacing:1px; margin-bottom:4px;" id="heroes-class-label"></div>
  </div>
  <div style="display:flex; align-items:center; justify-content:center; gap:12px; margin:12px 0;" id="heroes-loading">
    <div class="loading-dots"><span></span><span></span><span></span></div>
    <div style="font-family:'Cinzel',serif; font-size:12px; color:var(--text-muted);">Carregando heróis...</div>
  </div>
  <div class="heroes-grid" id="heroes-grid"></div>
  <button class="btn-sm" onclick="goBackToClasses()" style="margin-top:20px;">← Voltar às Classes</button>
</div>

<!-- ======================== SCREEN: STATS CONFIRM ======================== -->
<div id="screen-stats" class="screen">
  <div style="text-align:center; margin-bottom:20px;">
    <div class="phase-title">Confirmação de Atributos</div>
    <div class="phase-name" id="stats-player-label"></div>
  </div>
  <div class="stat-confirm-card">
    <div id="stats-hero-img-wrap" style="text-align:center; margin-bottom:14px;"></div>
    <div style="font-family:'Cinzel',serif; font-size:14px; color:var(--text); text-align:center; margin-bottom:4px;" id="stats-hero-name"></div>
    <div style="font-family:'Cinzel',serif; font-size:11px; color:var(--purple-light); text-align:center; margin-bottom:18px; letter-spacing:2px;" id="stats-hero-class"></div>

    <div class="stat-row">
      <span class="stat-label">VIDA MÁXIMA</span>
      <div class="stat-stepper">
        <button class="step-btn" onclick="adjustStat('hp',-1)">−</button>
        <span class="stat-val" id="stat-hp-val">5</span>
        <button class="step-btn" onclick="adjustStat('hp',1)">+</button>
      </div>
    </div>
    <div class="stat-row">
      <span class="stat-label">MANA MÁXIMA</span>
      <div class="stat-stepper">
        <button class="step-btn" onclick="adjustStat('mp',-1)">−</button>
        <span class="stat-val" id="stat-mp-val">3</span>
        <button class="step-btn" onclick="adjustStat('mp',1)">+</button>
      </div>
    </div>

    <button class="btn-primary" style="width:100%; margin-top:18px;" id="btn-confirm-stats" onclick="confirmStats()">
      Confirmar →
    </button>
  </div>
</div>

<!-- ======================== SCREEN: DASHBOARD ======================== -->
<div id="screen-dashboard" class="screen">
  <div class="dashboard-header">
    <div class="dash-title-wrap">
      <img class="site-logo-img-sm" id="logo-header" alt="Massive Darkness 2">
      <div class="dash-title">Partida em Curso</div>
    </div>
    <div class="dash-controls">
      <button class="btn-sm" onclick="resetGame()" style="color:#cc4444; border-color:#7a2a2a;">Reiniciar</button>
    </div>
  </div>

  <!-- Kill / XP event panel -->
  <div class="kill-panel">
    <div class="kill-label">EVENTO:</div>
    <button class="kill-btn horde" onclick="openKillModal('horde')">Turba Morta</button>
    <button class="kill-btn roaming" onclick="openKillModal('roaming')">Vagante Morto</button>
    <button class="kill-btn objetivo" onclick="openKillModal('objetivo')">Objetivo</button>
  </div>

  <div class="heroes-dashboard" id="heroes-dashboard"></div>
</div>

  { id:'berserker',    name:'Berserker',     icon:'BR' },
  { id:'ladino',       name:'Ladino',        icon:'LD' },
  { id:'xama',         name:'Xamã',          icon:'XA' },
  { id:'patrulheiro',  name:'Patrulheiro',   icon:'PT' },
  { id:'necromante',   name:'Necromante',    icon:'NC' },
  { id:'monge',        name:'Monge',         icon:'MJ' },
  { id:'artifice',     name:'Artífice',      icon:'AR' },
  { id:'bardo',        name:'Bardo',         icon:'BD' },
  { id:'druida',       name:'Druida',        icon:'DR' },
  { id:'cacador',      name:'Caçador',       icon:'CA' },
  { id:'assassino',    name:'Assassino',     icon:'AS' },
  { id:'herbalista',   name:'Herbalista',    icon:'HB' },
  { id:'guerreiro',    name:'Guerreiro',     icon:'GR' },
  { id:'clerigo',      name:'Clérigo',       icon:'CL' },
  { id:'cronomancer',  name:'Cronomancer',   icon:'CR' },
];

// Map class names (normalize for matching)
function normalizeClass(s) {
  return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
}
function classMatch(heroClass, classId) {
  const nc = normalizeClass(heroClass);
  const ni = normalizeClass(CLASSES.find(c=>c.id===classId)?.name||'');
  return nc === ni || nc.includes(ni) || ni.includes(nc);
}

// ===== LEVEL SYSTEM =====
// XP needed to reach next level from each level
const XP_TO_LEVEL = { 1:5, 2:10, 3:12, 4:14, 5:null }; // null = max
// Stat bonuses per level (cumulative extra max added ON leveling up)
// level 2: +1 hp; level 3: +1 hp +1 mp; level 4: +1 hp +1 mp; level 5: +1 hp +1 mp
const LEVEL_BONUSES = {
  2: { hp:1, mp:0 },
  3: { hp:1, mp:1 },
  4: { hp:1, mp:1 },
  5: { hp:1, mp:1 },
};

// ===== GAME STATE =====
let totalPlayers = 0;
let playerNames = [];
let players = []; // fully setup players
let setupIdx = 0; // which player is being set up
let currentSetupClass = null;
let allHeroes = []; // from supabase
let pendingConfirm = null; // { name, class, hero, baseHp, baseMp }
let modalCallback = null;

// ===== PARTICLES =====
(function spawnParticles(){
  const c = document.getElementById('particles');
  for(let i=0;i<18;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random()*4+2;
    p.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;animation-duration:${8+Math.random()*12}s;animation-delay:${Math.random()*8}s;`;
    c.appendChild(p);
  }
})();

// ===== SCREEN NAV =====
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

// ===== INTRO: player count =====
(function buildCountGrid(){
  const g = document.getElementById('count-grid');
  for(let i=1;i<=6;i++){
    const b = document.createElement('button');
    b.className='pcount-btn'; b.textContent=i;
    b.onclick=()=>selectCount(i);
    g.appendChild(b);
  }
})();

function selectCount(n){
  document.querySelectorAll('.pcount-btn').forEach((b,i)=>b.classList.toggle('selected',i+1===n));
  totalPlayers=n;
  buildNameInputs(n);
  document.getElementById('name-section').style.display='flex';
}

function buildNameInputs(n){
  const c=document.getElementById('name-inputs'); c.innerHTML='';
  for(let i=0;i<n;i++){
    const inp=document.createElement('input');
    inp.className='name-input'; inp.type='text';
    inp.placeholder=`Jogador ${i+1}`; inp.id=`pname-${i}`;
    inp.maxLength=20;
    c.appendChild(inp);
  }
}

function goToClasses(){
  playerNames=[];
  for(let i=0;i<totalPlayers;i++){
    const v=(document.getElementById(`pname-${i}`)?.value||'').trim()||`Jogador ${i+1}`;
    playerNames.push(v);
  }
  setupIdx=0;
  players=[];
  startPlayerSetup();
}

// ===== CLASS SELECTION =====
function startPlayerSetup(){
  if(setupIdx>=totalPlayers){ goToDashboard(); return; }
  currentSetupClass=null;
  buildClassesGrid();
  document.getElementById('classes-player-label').textContent=playerNames[setupIdx];
  showScreen('screen-classes');
}

function buildClassesGrid(){
  const g=document.getElementById('classes-grid'); g.innerHTML='';
  CLASSES.forEach((cls,i)=>{
    const b=document.createElement('div');
    b.className='class-btn';
    b.style.animationDelay=`${i*0.04}s`;
    b.innerHTML=`<div class="letter-mark letter-mark-md">${cls.icon}</div><div class="class-name">${cls.name}</div>`;
    b.onclick=()=>selectClass(cls);
    g.appendChild(b);
  });
}

async function selectClass(cls){
  currentSetupClass=cls;
  document.getElementById('heroes-player-label').textContent=playerNames[setupIdx];
  document.getElementById('heroes-class-label').textContent=cls.name;
  document.getElementById('heroes-loading').style.display='flex';
  document.getElementById('heroes-grid').innerHTML='';
  showScreen('screen-heroes');

  if(!allHeroes.length){
    const data=await supaFetch('global_settings','select=value&key=eq.personagens_items');
    if(data&&data[0]?.value){
      try{ allHeroes=JSON.parse(data[0].value)||[]; }catch{}
    }
  }
  document.getElementById('heroes-loading').style.display='none';
  buildHeroesGrid(cls);
}

function buildHeroesGrid(cls){
  const g=document.getElementById('heroes-grid'); g.innerHTML='';
  const filtered=allHeroes.filter(h=>classMatch(h.classe,cls.id));

  if(!filtered.length){
    g.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted);font-family:'Cinzel',serif;font-size:12px;">
      Nenhum herói cadastrado para <strong style="color:var(--gold)">${cls.name}</strong>.<br><br>
      <button class="btn-sm" onclick="addCustomHero()">+ Criar herói personalizado</button>
    </div>`;
    return;
  }

  // Add "sem herói específico" option
  const none=document.createElement('div');
  none.className='hero-card-pick';
  none.style.animationDelay='0s';
  none.innerHTML=`
    <div class="hero-img-placeholder"><div class="letter-mark letter-mark-lg">${cls.icon}</div></div>
    <div class="hero-pick-name">${cls.name} (Genérico)</div>`;
  none.onclick=()=>showStatsConfirm({id:'generic',name:cls.name+' (Genérico)',imageUrl:null,classe:cls.name});
  g.appendChild(none);

  filtered.forEach((h,i)=>{
    const card=document.createElement('div');
    card.className='hero-card-pick';
    card.style.animationDelay=`${i*0.05}s`;
    card.innerHTML=h.imageUrl
      ?`<img class="hero-img" src="${h.imageUrl}" alt="${h.name}" loading="lazy"><div class="hero-pick-name">${h.name}</div>`
      :`<div class="hero-img-placeholder"><div class="letter-mark letter-mark-lg">${cls.icon}</div></div><div class="hero-pick-name">${h.name}</div>`;
    card.onclick=()=>showStatsConfirm(h);
    g.appendChild(card);
  });
}

function goBackToClasses(){ showScreen('screen-classes'); }

function addCustomHero(){
  showStatsConfirm({id:'custom_'+Date.now(),name:currentSetupClass.name+' (Personalizado)',imageUrl:null,classe:currentSetupClass.name});
}

// ===== STATS CONFIRM =====
function showStatsConfirm(hero){
  pendingConfirm={ hero, baseHp:5, baseMp:3 };
  const cls=currentSetupClass;

  const wrap=document.getElementById('stats-hero-img-wrap');
  wrap.innerHTML=hero.imageUrl
    ?`<img class="hero-preview" src="${hero.imageUrl}" alt="${hero.name}">`
    :`<div style="width:120px;height:160px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;border:2px solid var(--purple);"><div class="letter-mark letter-mark-lg">${cls?.icon||'??'}</div></div>`;

  document.getElementById('stats-hero-name').textContent=hero.name;
  document.getElementById('stats-hero-class').textContent=cls?.name||hero.classe||'';
  document.getElementById('stats-player-label').textContent=playerNames[setupIdx];
  document.getElementById('stat-hp-val').textContent='5';
  document.getElementById('stat-mp-val').textContent='3';
  pendingConfirm.baseHp=5; pendingConfirm.baseMp=3;

  showScreen('screen-stats');
}

function adjustStat(type,delta){
  if(!pendingConfirm) return;
  if(type==='hp'){
    pendingConfirm.baseHp=Math.max(1,pendingConfirm.baseHp+delta);
    document.getElementById('stat-hp-val').textContent=pendingConfirm.baseHp;
  } else {
    pendingConfirm.baseMp=Math.max(0,pendingConfirm.baseMp+delta);
    document.getElementById('stat-mp-val').textContent=pendingConfirm.baseMp;
  }
}

function confirmStats(){
  if(!pendingConfirm) return;
  const p={
    idx: setupIdx,
    name: playerNames[setupIdx],
    class: currentSetupClass,
    hero: pendingConfirm.hero,
    baseHp: pendingConfirm.baseHp,
    baseMp: pendingConfirm.baseMp,
    maxHp: pendingConfirm.baseHp,
    maxMp: pendingConfirm.baseMp,
    hp: pendingConfirm.baseHp,
    mp: pendingConfirm.baseMp,
    xp: 0,
    level: 1,
    dead: false,
  };
  players.push(p);
  setupIdx++;
  startPlayerSetup();
}

// ===== DASHBOARD =====
function goToDashboard(){
  renderDashboard();
  showScreen('screen-dashboard');
}

function renderDashboard(){
  const c=document.getElementById('heroes-dashboard'); c.innerHTML='';
  players.forEach(p=>{ c.appendChild(buildHeroCard(p)); });
}

function buildHeroCard(p){
  const wrap=document.createElement('div');
  wrap.className='hero-dash-card'+(p.dead?' dead':'');
  wrap.id=`hcard-${p.idx}`;

  const xpNeeded=XP_TO_LEVEL[p.level];
  const xpPct=xpNeeded ? Math.min(100,Math.round(p.xp/xpNeeded*100)) : 100;
  const hpPct=p.maxHp>0 ? Math.min(100,Math.round(p.hp/p.maxHp*100)) : 0;
  const mpPct=p.maxMp>0 ? Math.min(100,Math.round(p.mp/p.maxMp*100)) : 0;

  wrap.innerHTML=`
    <!-- Level + XP bar -->
    <div class="hero-level-bar">
      <div class="level-badge">NÍVEL ${p.level}</div>
      <div class="xp-info">
        <div class="xp-val">${p.xp} <span style="font-size:11px;color:var(--text-muted);">XP</span></div>
        <div class="xp-bar-wrap"><div class="xp-bar" style="width:${xpPct}%"></div></div>
        <div class="xp-needed">${xpNeeded?`→ ${xpNeeded} p/ Nível ${p.level+1}`:'Nível Máximo'}</div>
      </div>
      <div class="letter-mark letter-mark-sm">${p.class?.icon||'??'}</div>
    </div>

    <!-- Full card portrait (sem corte) -->
    <div class="hero-portrait-wrap-full">
      ${p.hero?.imageUrl
        ?`<img class="hero-portrait-full" src="${p.hero.imageUrl}" alt="${p.hero.name}">`
        :`<div class="hero-portrait-placeholder-full"><div class="letter-mark letter-mark-xl">${p.class?.icon||'??'}</div></div>`}
      <div class="player-name-tag-full">${p.name}</div>
    </div>

    <!-- Stats -->
    <div class="hero-stats-full">
      <div class="hero-name-row">
        <div class="hero-name">${p.hero?.name||p.class?.name||'Herói'}</div>
        <div class="hero-class">${p.class?.name||''}</div>
      </div>

      <!-- HP -->
      <div class="stat-bar-row">
        <div class="stat-bar-header">
          <span class="stat-bar-label">VIDA</span>
          <span class="stat-bar-val hp">${p.hp}<span style="font-size:10px;color:var(--text-muted);">/${p.maxHp}</span></span>
        </div>
        <div class="stat-bar-track"><div class="stat-bar-fill hp" style="width:${hpPct}%"></div></div>
      </div>

      <!-- MP -->
      <div class="stat-bar-row">
        <div class="stat-bar-header">
          <span class="stat-bar-label">MANA</span>
          <span class="stat-bar-val mp">${p.mp}<span style="font-size:10px;color:var(--text-muted);">/${p.maxMp}</span></span>
        </div>
        <div class="stat-bar-track"><div class="stat-bar-fill mp" style="width:${mpPct}%"></div></div>
      </div>
    </div>

    <!-- Actions -->
    <div class="hero-actions">
      <button class="act-btn dmg" onclick="openActionModal(${p.idx},'dmg')">Dano</button>
      <button class="act-btn heal" onclick="openActionModal(${p.idx},'heal')">Curar</button>
      <button class="act-btn mana" onclick="openActionModal(${p.idx},'mana')">Mana</button>
      <button class="act-btn xpbtn" onclick="openActionModal(${p.idx},'xp')">XP Obj.</button>
    </div>`;

  return wrap;
}

function refreshCard(p){
  const existing=document.getElementById(`hcard-${p.idx}`);
  if(!existing) return;
  const fresh=buildHeroCard(p);
  existing.replaceWith(fresh);
}

// ===== XP & LEVELING =====
function addXp(playerIdx, amount){
  const p=players[playerIdx];
  if(!p||p.dead) return;
  p.xp+=amount;
  checkLevelUp(p);
  refreshCard(p);
}

function addXpAll(amount, exceptIdx=null){
  players.forEach(p=>{
    if(p.dead) return;
    if(p.idx===exceptIdx) return;
    p.xp+=amount;
    checkLevelUp(p);
    refreshCard(p);
  });
}

function checkLevelUp(p){
  const needed=XP_TO_LEVEL[p.level];
  if(!needed) return; // level 5 = max
  if(p.xp>=needed){
    p.xp-=needed;
    p.level=Math.min(5,p.level+1);
    // Apply stat bonuses
    const bonus=LEVEL_BONUSES[p.level]||{hp:0,mp:0};
    p.maxHp+=bonus.hp;
    p.maxMp+=bonus.mp;
    // Heal/restore on level up? Keep current values, just increase max
    showLevelUpModal(p);
    // Check again (might chain if xp overflows)
    checkLevelUp(p);
  }
}

// ===== LEVEL UP MODAL (popup grande) =====
let levelUpQueue = [];
let levelUpShowing = false;

function showLevelUpModal(p){
  const bonus=LEVEL_BONUSES[p.level]||{hp:0,mp:0};
  levelUpQueue.push({
    name: p.name,
    level: p.level,
    heroName: p.hero?.name || p.class?.name || '',
    imageUrl: p.hero?.imageUrl || null,
    classIcon: p.class?.icon || '??',
    bonus,
  });
  if(!levelUpShowing) processLevelUpQueue();
}

function processLevelUpQueue(){
  if(!levelUpQueue.length){ levelUpShowing=false; return; }
  levelUpShowing=true;
  const data=levelUpQueue.shift();

  document.getElementById('levelup-name').textContent=data.name;
  document.getElementById('levelup-hero-name').textContent=data.heroName;
  document.getElementById('levelup-level-num').textContent=data.level;

  const bonusParts=[];
  if(data.bonus.hp) bonusParts.push(`+${data.bonus.hp} VIDA MÁXIMA`);
  if(data.bonus.mp) bonusParts.push(`+${data.bonus.mp} MANA MÁXIMA`);
  const bonusEl=document.getElementById('levelup-bonus');
  bonusEl.textContent=bonusParts.join('   ');
  bonusEl.style.display=bonusParts.length?'block':'none';

  document.getElementById('levelup-portrait-wrap').innerHTML = data.imageUrl
    ? `<img class="levelup-portrait" src="${data.imageUrl}" alt="${data.heroName}">`
    : `<div class="levelup-portrait-placeholder"><div class="letter-mark letter-mark-xl">${data.classIcon}</div></div>`;

  document.getElementById('levelup-overlay').classList.add('open');
}

function closeLevelUpModal(){
  document.getElementById('levelup-overlay').classList.remove('open');
  setTimeout(processLevelUpQueue, 250);
}

// ===== KILL EVENTS =====
let killModalType=null;

function openKillModal(type){
  killModalType=type;
  if(type==='horde'){
    const killerIdx=getKillerIdx();
    if(killerIdx!==null){
      distributeKill('horde', killerIdx);
    } else {
      openPlayerPicker('horde');
    }
  } else if(type==='roaming'){
    openPlayerPicker('roaming');
  } else if(type==='objetivo'){
    openPlayerPicker('objetivo');
  }
}

// Ask who killed / collected
function openPlayerPicker(type){
  const labels={horde:'Quem matou a Turba?',roaming:'Quem matou o Vagante?',objetivo:'Quem coletou o Objetivo?'};
  const modal=document.getElementById('modal');
  const box=modal.querySelector('.modal-box');

  box.innerHTML=`
    <div class="modal-title">${labels[type]}</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;">
      ${players.map(p=>`
        <button class="kill-btn" style="width:100%;padding:12px;" onclick="onPickKiller(${p.idx},'${type}')">
          ${p.name}
        </button>`).join('')}
    </div>
    <button class="modal-cancel" onclick="closeModal()">Cancelar</button>`;

  modal.classList.add('open');
}

function onPickKiller(playerIdx, type){
  closeModal();
  if(type==='objetivo'){
    // Ask XP amount
    openXpInput(playerIdx);
  } else {
    distributeKill(type, playerIdx);
  }
}

function openXpInput(playerIdx){
  const modal=document.getElementById('modal');
  const box=modal.querySelector('.modal-box');
  box.innerHTML=`
    <div class="modal-title">XP do Objetivo</div>
    <input id="modal-input" class="modal-input" type="number" min="1" value="3" autofocus>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">Cancelar</button>
      <button class="modal-confirm" onclick="onConfirmObjective(${playerIdx})">Confirmar</button>
    </div>`;
  modal.classList.add('open');
  setTimeout(()=>document.getElementById('modal-input')?.focus(),50);
}

function onConfirmObjective(playerIdx){
  const v=parseInt(document.getElementById('modal-input')?.value)||0;
  closeModal();
  if(v>0) addXp(playerIdx, v);
}

function distributeKill(type, killerIdx){
  if(type==='horde'){
    addXp(killerIdx,3);
    addXpAll(2, killerIdx);
    showEventToast(`Turba! +3 XP para ${players[killerIdx].name}, +2 para os demais.`);
  } else if(type==='roaming'){
    addXp(killerIdx,5);
    addXpAll(4, killerIdx);
    showEventToast(`Vagante! +5 XP para ${players[killerIdx].name}, +4 para os demais.`);
  }
}

function getKillerIdx(){
  return players.length===1 ? players[0].idx : null;
}

function showEventToast(msg){
  const t=document.getElementById('levelup-toast');
  t.innerHTML=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

// ===== ACTION MODAL =====
function openActionModal(playerIdx, type){
  const p=players[playerIdx];
  if(!p) return;
  const labels={dmg:`Dano — ${p.name}`,heal:`Curar — ${p.name}`,mana:`Mana — ${p.name}`,xp:`XP Objetivo — ${p.name}`};
  const modal=document.getElementById('modal');
  const box=modal.querySelector('.modal-box');

  if(type==='mana'){
    // Show use or restore
    box.innerHTML=`
      <div class="modal-title">${labels[type]}</div>
      <div style="text-align:center;font-family:'Cinzel',serif;font-size:11px;color:var(--text-muted);margin-bottom:12px;">
        Mana atual: <strong style="color:var(--blue-light)">${p.mp}/${p.maxMp}</strong>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:12px;">
        <button class="act-btn mana" style="flex:1;padding:12px;" onclick="manaAction(${playerIdx},'use')">− Usar</button>
        <button class="act-btn heal" style="flex:1;padding:12px;" onclick="manaAction(${playerIdx},'restore')">+ Restaurar</button>
      </div>
      <div id="mana-input-row" style="display:none;flex-direction:column;gap:8px;">
        <input id="modal-input" class="modal-input" type="number" min="1" value="1">
        <div class="modal-btns">
          <button class="modal-cancel" onclick="closeModal()">Cancelar</button>
          <button class="modal-confirm" id="mana-confirm-btn">Confirmar</button>
        </div>
      </div>
      <button class="modal-cancel" style="width:100%;" onclick="closeModal()">Cancelar</button>`;
    modal.classList.add('open');
    return;
  }

  box.innerHTML=`
    <div class="modal-title">${labels[type]}</div>
    <input id="modal-input" class="modal-input" type="number" min="1" value="1">
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">Cancelar</button>
      <button class="modal-confirm" onclick="confirmAction(${playerIdx},'${type}')">Confirmar</button>
    </div>`;
  modal.classList.add('open');
  setTimeout(()=>document.getElementById('modal-input')?.focus(),50);
}

function manaAction(playerIdx, action){
  const row=document.getElementById('mana-input-row');
  row.style.display='flex';
  const btn=document.getElementById('mana-confirm-btn');
  btn.onclick=()=>confirmAction(playerIdx, action==='use'?'mana_use':'mana_restore');
  setTimeout(()=>document.getElementById('modal-input')?.focus(),50);
}

function confirmAction(playerIdx, type){
  const v=parseInt(document.getElementById('modal-input')?.value)||1;
  const p=players[playerIdx];
  if(!p){closeModal();return;}

  if(type==='dmg'){
    p.hp=Math.max(0,p.hp-v);
    if(p.hp===0) p.dead=true;
  } else if(type==='heal'){
    p.hp=Math.min(p.maxHp,p.hp+v);
    p.dead=false;
  } else if(type==='mana_use'){
    p.mp=Math.max(0,p.mp-v);
  } else if(type==='mana_restore'){
    p.mp=Math.min(p.maxMp,p.mp+v);
  } else if(type==='xp'){
    closeModal(); addXp(playerIdx,v); return;
  }

  closeModal();
  refreshCard(p);
}

function closeModal(){
  const modal=document.getElementById('modal');
  modal.classList.remove('open');
  const box=modal.querySelector('.modal-box');
  // Restore default structure
  box.innerHTML=`
    <div class="modal-title" id="modal-title">Inserir Valor</div>
    <input id="modal-input" class="modal-input" type="number" min="0" value="0">
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">Cancelar</button>
      <button class="modal-confirm" onclick="confirmModal()">Confirmar</button>
    </div>`;
  modalCallback=null;
}

function confirmModal(){
  if(modalCallback) modalCallback(parseInt(document.getElementById('modal-input')?.value)||0);
  closeModal();
}

// ===== RESET =====
function resetGame(){
  if(!confirm('Reiniciar a partida?')) return;
  totalPlayers=0; playerNames=[]; players=[]; setupIdx=0;
  currentSetupClass=null; pendingConfirm=null; allHeroes=[];
  document.querySelectorAll('.pcount-btn').forEach(b=>b.classList.remove('selected'));
  document.getElementById('name-section').style.display='none';
  showScreen('screen-intro');
}

// ===== KEYBOARD ESC =====
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
</script>
